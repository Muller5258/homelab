services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [proxy]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma:/app/data
    networks: [proxy]

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [proxy]

  nextcloud:
    image: nextcloud:apache
    restart: unless-stopped
    depends_on: [db]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${SERVER_IP}.nip.io
      TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - nextcloud_data:/var/www/html
    networks: [proxy, backend]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]

  # ---- stage 3 ----
  visit-counter:
    image: ghcr.io/muller5258/visit-counter:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@app-db:5432/app
    depends_on:
      app-db:
        condition: service_healthy
    networks: [proxy, app-backend]

  app-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10
    volumes:
      - app_db_data:/var/lib/postgresql/data
    networks: [app-backend]

  # ---- stage 4: monitoring ----
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter
    restart: unless-stopped
    pid: host
    command: --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [proxy, monitoring]

networks:
  proxy:
  backend:
  app-backend:
  monitoring:

volumes:
  caddy_data:
  portainer_data:
  nextcloud_data:
  db_data:
  app_db_data:
  prometheus_data:
  grafana_data:
  uptime-kuma:
    external: true
